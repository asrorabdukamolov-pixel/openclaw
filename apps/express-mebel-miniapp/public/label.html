<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>Etiketka — Express Mebel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      /* One label per box, sized for a 58 × 40 mm thermal label printer. */
      @page {
        size: 58mm 40mm;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: "Montserrat", Arial, sans-serif;
        color: #2b2a29;
        background: #e9ebe9;
      }
      .label {
        width: 58mm;
        height: 40mm;
        box-sizing: border-box;
        padding: 2mm 3mm;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #fff;
        overflow: hidden;
        page-break-after: always;
        break-after: page;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 7pt;
        font-weight: 700;
      }
      .name {
        font-size: 8pt;
        font-weight: 700;
        line-height: 1.15;
        max-height: 2.3em;
        overflow: hidden;
      }
      .box {
        font-size: 11pt;
        font-weight: 700;
      }
      svg {
        width: 100%;
        height: 13mm;
      }
      .bar {
        position: sticky;
        top: 0;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        background: #2b2a29;
        color: #fff;
        font-size: 15px;
      }
      .bar button {
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: #008e9b;
        color: #fff;
        font: 700 15px "Montserrat", Arial, sans-serif;
        cursor: pointer;
      }
      .sheet {
        display: flex;
        flex-wrap: wrap;
        gap: 6mm;
        padding: 6mm;
      }
      @media print {
        .bar {
          display: none;
        }
        body {
          background: #fff;
        }
        .sheet {
          display: block;
          padding: 0;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  </head>
  <body>
    <div class="bar"><span id="info">Yuklanmoqda…</span><button onclick="window.print()">🖨 Chop etish</button></div>
    <div class="sheet" id="sheet"></div>
    <script src="/label.js" type="module"></script>
  </body>
</html>
