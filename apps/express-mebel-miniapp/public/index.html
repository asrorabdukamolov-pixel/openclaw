<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Express Mebel</title>
    <link rel="icon" href="/img/mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&family=Prompt:ital,wght@0,400;0,600;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <button class="avatar" id="avatarBtn" aria-label="Profil"><span id="avatar">EM</span></button>
      <button class="order-type" id="orderTypeBtn">
        <span id="orderTypeLabel">Buyurtma turi</span>
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" /></svg>
      </button>
      <button class="burger" id="menuBtn" aria-label="Menyu"><span></span><span></span><span></span></button>
    </header>

    <main id="shop">
      <section class="banners" id="banners"></section>
      <div class="dots" id="dots"></div>

      <label class="search">
        <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" /><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        <input id="search" type="search" placeholder="Qidirish" autocomplete="off" />
      </label>

      <nav class="tabs-wrap" id="tabsWrap">
        <button class="tab-arrow" id="tabsPrev" aria-label="Oldingi">‹</button>
        <div class="tabs" id="tabs"></div>
        <button class="tab-arrow" id="tabsNext" aria-label="Keyingi">›</button>
      </nav>

      <div id="sections"></div>
      <p class="empty" id="empty" hidden>Hech narsa topilmadi</p>
    </main>

    <button class="cart-fab" id="cartFab" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.7a2 2 0 001.9-1.4L21 8H6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="10" cy="20" r="1.5" fill="currentColor" /><circle cx="17" cy="20" r="1.5" fill="currentColor" /></svg>
      <span id="cartCount">0</span>
      <b id="cartTotal">0</b>
    </button>

    <div class="sheet-backdrop" id="backdrop" hidden></div>
    <section class="sheet" id="sheet" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <div class="logo logo--light">
          <i></i><i></i><i></i>
          <span><b>express</b><b>mebel</b></span>
        </div>
      </div>
      <nav class="drawer-nav" id="drawerNav"></nav>
      <p class="drawer-foot">Interyeringiz uchun mukammal mebel</p>
    </aside>

    <div class="toast" id="toast" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
